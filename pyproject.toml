[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "quantum-inspired-task-planner"
version = "1.0.0"
description = "QUBO-based DAG scheduler: formulates precedence-constrained scheduling as QUBO and solves with simulated annealing"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Schmidt" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
